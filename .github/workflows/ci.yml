name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 版本基线见 .tool-versions 与 docs/03-技术选型.md §2。两处要一起改。
  FLUTTER_VERSION: 3.44.8

jobs:
  lint:
    name: lint（格式 + 静态检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - name: 生成 drift 产物（database.g.dart 等）
        # 断言产物真的生成了 —— 这一步拦的就是「生成器静默写 0 个输出」。
        #
        # 背景：`melos run generate` 曾在 pub workspace 下写 0 个输出（exit 0、不报错），
        # 于是 database.g.dart 一直生成不出来，只能靠入库 + .gitignore 开例外解封发布链，
        # ADR-008 那句「产物不提交」实际是假的。根因已改（generate 走
        # `build_runner build --workspace`，CI 实测 `wrote 55 outputs`），产物也已移出
        # 版本控制。这条断言留在原地，是为了下次再有人把 generate 改坏时立刻红，
        # 而不是又靠一份入库的产物把问题盖住。
        run: |
          melos run generate
          test -f packages/storage/lib/src/database/database.g.dart
      - name: 格式一致性
        run: melos run format:check
      - name: 零告警才算通过
        run: melos run analyze

  arch:
    name: arch（分层纪律）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run check:arch

  commitlint:
    name: commitlint（提交信息）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史才能算出 PR 区间。
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: 校验 PR 内每条提交
        run: >
          dart run tools/commit_lint/bin/commit_lint.dart
          --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  test:
    name: test（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - run: melos run test

  build-check:
    name: build-check（${{ matrix.target }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux 桌面构建依赖
        if: matrix.target == 'linux'
        # libasound2-dev：volume_controller 的 linux/CMakeLists.txt 里是
        # `find_package(ALSA REQUIRED)`，缺了直接 FATAL_ERROR，构建在配置阶段就断。
        # 其余 Linux 插件不需要额外系统库：media_kit_video 找不到
        # package:media_kit_libs_linux 时只打一句 WARNING 并编译 stub
        # （MEDIA_KIT_LIBS_NOT_FOUND=1），jni 的 find_package(JNI) 不带 REQUIRED。
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - name: 构建
        working-directory: apps/mistream
        run: flutter build ${{ matrix.target }} --debug

  release-windows:
    name: release-windows（Release 包链）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run generate
      - name: 安装 libmpv（Release 播放内核）
        run: melos run libmpv:install
      - name: 构建 Release（CMake 内自动跑 quickjs:install + spider-js:bundle）
        working-directory: apps/mistream
        run: flutter build windows --release
      - name: 校验产物包链（smoke 握手）
        run: >
          dart run tools/check_spider_js_bundle.dart
          --bundle apps/mistream/build/windows/x64/runner/Release --smoke
      - name: 上传 Release 产物
        uses: actions/upload-artifact@v7
        with:
          name: mistream-windows-release
          path: apps/mistream/build/windows/x64/runner/Release
          retention-days: 14

# TODO(M10): 补 license 扫描（禁 AGPL/SSPL）、golden 测试、体积门禁与
# 「安装包不含源配置」的合规扫描。见 docs/10-开发规范.md §5.1 与
# docs/03-技术选型.md §6.2。
