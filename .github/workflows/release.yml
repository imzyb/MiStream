name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布草稿
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - name: 门禁
        run: melos run check:arch && melos run analyze
      - name: 安装 libmpv/quickjs/jvm
        run: melos run libmpv:install && melos run quickjs:install && powershell -File tools/build_jvm_runtime.ps1
      - name: 构建 Windows
        run: flutter build windows --release
      - name: 合规扫描（安装包不含源配置）
        run: powershell -File tools/release_check.ps1
      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: build/windows/x64/runner/Release/mistream.exe
