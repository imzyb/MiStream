# MiStream monorepo 的 pub workspace 根。
#
# 这不是一个可发布的包，只承担三件事：
#   1. 声明 workspace 成员，让全仓库共享一份依赖解析与一份 pubspec.lock
#   2. 持有全局开发期依赖（lint 规则集），供根 analysis_options.yaml 的
#      `include: package:...` 解析
#   3. 承载 melos 配置。Melos 7 起不再读 melos.yaml：配置必须写在下面的
#      `melos:` 键里，且 melos 本身必须是根包的 dev_dependency——melos 正是
#      靠「向上找哪个 pubspec.yaml 的 dev_dependencies 里有 melos」来定位
#      仓库根的，缺了它连 `melos list` 都会报「不在 workspace 内」。
#
# 目录含义见 docs/02-系统架构.md §5。
name: mistream_workspace
description: MiStream monorepo workspace root（不发布）
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/mistream
  - packages/core_domain
  - packages/core_logging
  - packages/core_config
  - packages/spider_host
  - packages/player_engine
  - packages/storage
  - packages/plugin_host
  - packages/search_engine
  - packages/play_engine
  - packages/source_adapter
  - packages/theme_engine
  - packages/media_sniffer
  - packages/live
  - packages/download
  - packages/text_codec
  - runtimes/spider_js
  - runtimes/spider_python
  - runtimes/spider_jvm
  - runtimes/sniffer
  - tools/arch_check
  - tools/commit_lint
  - tools/libmpv_dist
  - tools/mock_source_server
  - tools/quickjs_dist
  - tools/theme_lint

dev_dependencies:
  # 上界锁在 7.8.2：melos 自 7.8.2 起要求 cli_util ^0.5.0，而 stable 基线上
  # 唯一可用的 drift_dev（≤2.34.0，见 packages/storage/pubspec.yaml）要
  # cli_util ^0.4.0，两者互斥。整条约束链的起点是 Flutter 3.44.x stable 的
  # flutter_test 钉死 test_api 0.7.11。等 stable 跟进 Dart 3.13 后一并放开。
  melos: ">=7.8.0 <7.8.2"
  test: ^1.31.0
  very_good_analysis: ^10.3.0

melos:
  # 刻意没有 packages 字段：Melos 7 起直接复用上面的 workspace 列表。
  # 同一份成员清单写两遍，迟早会有人只改一边。

  command:
    bootstrap:
      # bootstrap 是每个人上手的第一条命令，把 git hooks 的安装挂在这里，
      # 比写进 README 指望人手动执行可靠。
      hooks:
        post: git config core.hooksPath .githooks

  scripts:
    hooks:install:
      description: 安装 git hooks（bootstrap 已自动执行，此处供手动修复）
      run: git config core.hooksPath .githooks

    format:
      description: 格式化全部 Dart 代码
      run: dart format .

    format:check:
      description: 校验格式一致性，不改文件（CI 用）
      run: dart format --output=none --set-exit-if-changed .

    analyze:
      description: 静态检查，零告警才算通过（docs/10 §3.1）
      run: flutter analyze --fatal-infos --fatal-warnings

    test:dart:
      description: 纯 Dart 包单测
      run: melos exec --concurrency 1 -- dart test
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      description: Flutter 包单测
      run: melos exec --concurrency 1 -- flutter test
      packageFilters:
        flutter: true
        dirExists: test

    test:
      description: 全部单测
      run: melos run test:dart --no-select && melos run test:flutter --no-select

    check:arch:
      description: 分层纪律与 ignore 注释校验（ROADMAP M0 出口标准 ③）
      run: dart run tools/arch_check/bin/arch_check.dart

    theme:lint:
      description: 校验主题包（docs/06-插件系统.md §9 的 `mistream theme lint`）
      run: dart run tools/theme_lint/bin/theme_lint.dart

    check:all:
      description: M0 出口标准一键校验
      run: >
        melos run format:check --no-select &&
        melos run analyze --no-select &&
        melos run check:arch --no-select &&
        melos run test --no-select

    generate:
      description: 生成 drift 代码（ADR-008：产物不提交，CI 与本地都走 build_runner）
      # ⚠️ 必须带 --workspace，且**不能**写 packageFilters。
      #
      # 原写法是 `dart run build_runner build --delete-conflicting-outputs` 配
      # `packageFilters: dependsOn: build_runner`：melos 会 cd 进 packages/storage
      # 跑一次**单包构建**。在 pub workspace 下这次构建实测写 **0 个输出**
      # （CI 日志 `Built with build_runner/aot in 13s; wrote 0 outputs.`），
      # database.g.dart 于是永远生成不出来，只能靠入库解封发布链。
      #
      # `--workspace` 是「构建当前 workspace 内的全部包」，由仓库根跑一次，
      # 因此必须去掉 packageFilters（没有它 melos 才在根目录执行；format:check /
      # analyze 都是这么跑的）。`--delete-conflicting-outputs` 自 build_runner
      # 2.15 起已列入 removedOptions，只会打一句警告，顺手删掉。
      run: dart run build_runner build --workspace

    schema:update:
      description: 刷新 drift schema 快照并重生成迁移验证代码（改表后跑一次）
      run: >
        dart run drift_dev schema dump lib/src/database/database.dart drift_schemas/ &&
        dart run drift_dev schema generate drift_schemas/ lib/src/database/schema_versions.dart
      packageFilters:
        dirExists: drift_schemas

    libmpv:install:
      description: 下载并校验 libmpv（锁定版本 + SHA256），装进 build/libmpv
      run: dart run tools/libmpv_dist/bin/libmpv_dist.dart install

    quickjs:install:
      description: 校验并安装 vendored QuickJS DLL 到 spider_js 引擎目录
      run: dart run tools/quickjs_dist/bin/quickjs_dist.dart install

    jvm:build:
      description: 编译 spider_jvm_runtime.jar（需 JDK17，libs 已随包）
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_jvm_runtime.ps1

    spider-js:bundle:
      description: 编译并验证 Windows Spider JS AOT 运行时包
      run: >
        powershell -NoProfile -ExecutionPolicy Bypass
        -File tools/build_spider_js_runtime.ps1
        -Configuration Release
        -OutputDirectory build/spider_js
