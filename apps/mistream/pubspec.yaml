name: mistream
description: >
  MiStream 主应用：路由、主题装配、启动流程与各 feature 的 UI。
  Presentation / Application 层，见 docs/02-系统架构.md §5。
# 发布版本号的唯一事实来源，改这里要同步 docs/checklists/release.md 列的其余位置。
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # 错误码/错误对象：错误卡片要按影视码查人话文案，直接依赖领域类型。
  core_domain:
    path: ../../packages/core_domain
  flutter:
    sdk: flutter
  # 播放内核抽象。UI 层只依赖它（docs/04-播放器设计.md §2），真画面渲染用的是
  # media_kit_video，但那只在接入具体 `VideoController` 时才需要；控制栏、进度条、
  # 快捷键这些骨架只认 PlayerEngine 这一层接口，用它就能测。
  player_engine:
    path: ../../packages/player_engine

dev_dependencies:
  flutter_test:
    sdk: flutter

# 不引 flutter_lints：全仓库统一用根 analysis_options.yaml 的 very_good_analysis，
# 两套规则集叠加只会产生互相矛盾的告警（docs/10-开发规范.md §3.1）。

flutter:
  uses-material-design: true
