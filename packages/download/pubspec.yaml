name: download
description: >
  离线下载模块：HLS分片下载、断点续传、任务管理、进度通知。
  M8 离线下载，见 docs/02-系统架构.md。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  core_domain:
    path: ../core_domain
  # 任务与分片进度落库（`download` / `download_segment` 两张表）。与 `live`
  # 包同一模式：模块自己的 drift 仓储放在模块包内，而不是塞进 `storage`。
  storage:
    path: ../storage
  drift: ^2.34.4
  meta: ^1.18.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.31.0