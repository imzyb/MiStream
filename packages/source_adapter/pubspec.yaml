name: source_adapter
description: >
  应用层 UseCase 与基础设施的适配器（Storage/SpiderHost 桥接）。
  提供 SourceProvider/SpiderSearcher/SpiderPlayerApi 的实现。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  core_domain:
    path: ../core_domain
  play_engine:
    path: ../play_engine
  search_engine:
    path: ../search_engine
  spider_host:
    path: ../spider_host
  storage:
    path: ../storage
  meta: ^1.18.0

dev_dependencies:
  mock_source_server:
    path: ../../tools/mock_source_server
  test: ^1.31.0