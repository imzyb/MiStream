name: sniffer
description: >
  无头浏览器嗅探子进程，统一走 CDP。M6 落地，见 docs/05-Spider引擎.md §6。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # 媒体判定规则（MediaDetector / SnifferRule）复用这里，
  # 保证 CDP 版与 WebView 版只有一份命中标准。
  media_sniffer:
    path: ../../packages/media_sniffer
  meta: ^1.18.0
  # 实现 play_engine 的 SnifferLauncher 接缝需要这个接口。
  play_engine:
    path: ../../packages/play_engine

dev_dependencies:
  test: ^1.26.0
