name: spider_js
description: >
  QuickJS 运行时子进程与 drpy 宿主 API 兼容层。项目关键路径，M4 落地，
  见 docs/05-Spider引擎.md §2。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # ASN.1 与 RSA 原语。两者本来就是 encrypt 的传递依赖（encrypt → pointycastle
  # → asn1lib），此处显式提升为直接依赖：RSA 的 PEM 解析要用 asn1lib，
  # rsaX 的三种 padding 要用 pointycastle，靠传递依赖拿到属于「碰运气」——
  # encrypt 哪天换掉 pointycastle，这里就断了。
  asn1lib: ^1.6.5
  core_domain:
    path: ../../packages/core_domain
  crypto: ^3.0.6
  encrypt: ^5.0.3
  ffi: ^2.1.4
  html: ^0.15.6
  meta: ^1.18.0
  pointycastle: ^3.9.1
  spider_host:
    path: ../../packages/spider_host

dev_dependencies:
  mock_source_server:
    path: ../../tools/mock_source_server
  test: ^1.31.0
